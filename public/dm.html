<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DungeonHunter01 — DungeonMaster View</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="dmHeader">
    <div class="title">DUNGEON MASTER VIEW</div>
    <div id="dmInfo">connecting…</div>
  </div>

  <div id="dmRoster"></div>

  <aside id="dmControls">
    <button id="dmControlsToggle" type="button">GAME SETTINGS</button>
    <form id="dmSettingsForm" class="hidden">
      <label>Stamina regen / sec <input data-setting="staminaRegenPerSec" type="number" min="0" max="50" step="1" /></label>
      <label>Regen delay (sec) <input data-setting="staminaRegenDelayMs" data-scale="1000" type="number" min="0" max="10" step="0.1" /></label>
      <label>Movement drain / sec <input data-setting="movementStaminaPerSec" type="number" min="0" max="100" step="1" /></label>
      <label>Movement speed multiplier <input data-setting="movementSpeedScale" type="number" min="0.25" max="3" step="0.05" /></label>
      <label>Boon lifetime (sec) <input data-setting="boonLifetimeMs" data-scale="1000" type="number" min="5" max="1800" step="5" /></label>
      <label>Chest delay minimum (sec) <input data-setting="cacheRespawnMinMs" data-scale="1000" type="number" min="0" max="300" step="1" /></label>
      <label>Chest delay maximum (sec) <input data-setting="cacheRespawnMaxMs" data-scale="1000" type="number" min="0" max="300" step="1" /></label>
      <label>Battle portal cooldown (sec) <input data-setting="battlePortalCooldownMs" data-scale="1000" type="number" min="0" max="600" step="1" /></label>
      <div class="dmSettingsActions">
        <button type="submit">APPLY</button>
        <button id="dmSettingsReset" type="button">RESET</button>
      </div>
      <div id="dmSettingsStatus">Changes apply to the running session.</div>
    </form>
  </aside>

  <script type="module" src="/dm.js"></script>
</body>
</html>
